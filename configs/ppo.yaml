# PPO-specific hyper-parameters.
# Inherits defaults from default.yaml; only overrides are listed here.

agent:
  obs_dim:       10
  n_actions:     9
  hidden_dim:    128

  # Rollout
  rollout_steps: 2048
  n_epochs:      10
  batch_size:    64

  # PPO objective
  clip_eps:      0.2
  vf_coef:       0.5
  ent_coef:      0.01
  max_grad_norm: 0.5

  # GAE
  gamma:         0.99
  gae_lambda:    0.95

  lr:            0.00025

train:
  total_steps:    1000000
  save_interval:  100000
  checkpoint_dir: checkpoints/ppo
